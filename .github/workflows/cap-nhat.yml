name: Cap nhat van ban moi
on:
  schedule:
    - cron: "0 5 * * *"   # 12:00 gio Viet Nam moi ngay
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chay bo cap nhat
        run: python cap_nhat_van_ban.py || true
      - name: Luu ket qua neu co thay doi
        run: |
          git config user.name "cap-nhat-tu-dong"
          git config user.email "actions@users.noreply.github.com"
          git add data/updates.js data/updates.json
          git diff --cached --quiet || (git commit -m "Cap nhat van ban moi" && git push)
